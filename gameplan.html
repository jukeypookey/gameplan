  function renderList() {
    const wrap = document.getElementById('itemList');
    if (events.length === 0 && tasks.length === 0) {
      wrap.innerHTML = '<div class="empty">Nothing added yet — start with classes and practices, then add tasks with a due day.</div>';
      return;
    }
    let html = '';
    [...events].sort((a, b) => a.offset - b.offset || a.start - b.start).forEach(ev => {
      html += `<div class="item" onclick="editEvent(${ev.id})" title="Tap to edit">
        <div class="info"><div class="t">${escapeHtml(ev.name)}</div><div class="d">${dayLabelFor(ev.offset)} &middot; ${formatMinutes(ev.start)} – ${formatMinutes(ev.end)}</div></div>
        <button class="remove" onclick="event.stopPropagation(); removeItem(${ev.id}, 'event')">&times;</button>
      </div>`;
    });
    [...tasks].sort((a, b) => (a.recurring ? -1 : 0) - (b.recurring ? -1 : 0) || (a.dueOffset ?? 99) - (b.dueOffset ?? 99)).forEach(tk => {
      const remaining = taskTimeRemaining(tk);
      const splitNote = tk.split ? ` &middot; ${remaining}m left of ${tk.duration}m (${tk.sessionLen}-min sessions)` : '';
      const whenNote = tk.recurring ? `Every ${recurDaysLabel(tk.recurDays)}` : `Due ${dayLabelFor(tk.dueOffset)}`;
      const priorityTag = tk.priority && tk.priority !== 'normal'
        ? ` <span class="priority-tag ${tk.priority}">${PRIORITY_LABEL[tk.priority]}</span>` : '';
      const categoryTag = tk.category ? ` <span class="category-tag">${escapeHtml(tk.category)}</span>` : '';
      const notesPreview = tk.notes ? `<div class="notes-preview">${escapeHtml(tk.notes)}</div>` : '';
      const subtaskNote = tk.subtasks && tk.subtasks.length ? ` &middot; ${subtaskSummary(tk)}` : '';
      // Recurring tasks don't have one "done" state — that's tracked per day on the Today dashboard.
      const checkCircle = tk.recurring
        ? ''
        : `<div class="check-circle small${tk.completed ? ' checked' : ''}" onclick="event.stopPropagation(); toggleTaskDoneFromList(${tk.id})"></div>`;
      html += `<div class="item task${tk.completed ? ' done' : ''}" onclick="editTask(${tk.id})" title="Tap to edit">
        ${checkCircle}<div class="info"><div class="t">${escapeHtml(tk.name)}${priorityTag}${categoryTag}</div><div class="d">${tk.duration} min &middot; ${whenNote} &middot; ${PREF_LABEL[tk.pref]}${splitNote}${subtaskNote}</div>${notesPreview}${renderSubtaskChecklist(tk, true)}</div>
        <button class="remove" onclick="event.stopPropagation(); removeItem(${tk.id}, 'task')">&times;</button>
      </div>`;
    });
    wrap.innerHTML = html;
  }

  // "Mark done" from the On the board list — for a split task this marks every session
  // complete at once (a shortcut); for a simple task it's a plain toggle.
  function toggleTaskDoneFromList(taskId) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    const goingDone = !task.completed;
    if (task.split) {
      const numSessions = Math.max(1, Math.ceil(task.duration / task.sessionLen));
      task.completedSessions = goingDone ? Array.from({ length: numSessions }, (_, i) => i) : [];
    }
    task.completed = goingDone;
    saveData();
    renderList();
    if (lastScheduleData) { lastScheduleData = computeSchedule(); renderSchedule(); }
  }

  function buildWeek() {
    const wrap = document.getElementById('timelineWrap');
    if (events.length === 0 && tasks.length === 0) {
      wrap.innerHTML = '<div class="empty">Add a few classes/events and tasks first, then build your week.</div>';
      lastScheduleData = null;
      return;
    }
    lastScheduleData = computeSchedule();
    renderSchedule();
    wrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // Expand each task into one or more schedulable units:
  // recurring tasks become one unit per matching weekday, split tasks become one unit per
  // not-yet-completed session, everything else is a single unit. A fully completed task
  // (or a split task whose sessions are all done) is excluded entirely — nothing left to schedule.
  function expandTask(task) {
    if (task.completed) return [];
    if (task.recurring) {
      const units = [];
      WEEK_DAYS.forEach(d => {
        if (task.recurDays.includes(d.dow)) {
          units.push({ ...task, unitName: task.name, unitDuration: task.duration, targetOffset: d.offset, forceOffset: d.offset, dueOffset: d.offset, sessionIndex: null });
        }
      });
      return units;
    }
    if (!task.split) {
      return [{ ...task, unitName: task.name, unitDuration: task.duration, targetOffset: null, sessionIndex: null }];
    }
    const numSessions = Math.max(1, Math.ceil(task.duration / task.sessionLen));
    const doneSessions = new Set(task.completedSessions || []);
    const units = [];
    for (let i = 0; i < numSessions; i++) {
      if (doneSessions.has(i)) continue;
      const remaining = task.duration - task.sessionLen * i;
      const dur = Math.min(task.sessionLen, remaining);
      const target = Math.min(task.dueOffset, Math.floor((i * (task.dueOffset + 1)) / numSessions));
      units.push({ ...task, unitName: `${task.name} (session ${i + 1}/${numSessions})`, unitDuration: dur, targetOffset: target, sessionIndex: i });
    }
    return units;
  }

  // Recurring units are pinned to their one matching day; everything else tries its
  // preferred/target day first, then falls back through earlier days up to the due day.
  function offsetOrder(unit) {
    if (unit.forceOffset !== null && unit.forceOffset !== undefined) return [unit.forceOffset];
    const full = Array.from({ length: unit.dueOffset + 1 }, (_, i) => i);
    if (unit.targetOffset === null || unit.targetOffset === undefined) return full;
    return [unit.targetOffset, ...full.filter(o => o !== unit.targetOffset)];
  }

  function computeSchedule() {
    const wake = toMinutes(document.getElementById('wakeTime').value);
    const bed = toMinutes(document.getElementById('bedTime').value);
    const dayWindow = bed - wake;

    // Per-day working gaps, computed fresh from each day's fixed events
    const dayGaps = {};
    const dayConflicts = {};
    WEEK_DAYS.forEach(d => {
      const dayEvents = events.filter(e => e.offset === d.offset).sort((a, b) => a.start - b.start);
      let gaps = [];
      let cursor = wake;
      const conflicts = [];
      dayEvents.forEach(ev => {
        if (ev.start < cursor) {
          const prev = dayEvents.find(o => o.end === cursor) || dayEvents[dayEvents.indexOf(ev) - 1];
          conflicts.push(`"${escapeHtml(ev.name)}" overlaps with "${escapeHtml(prev ? prev.name : 'another event')}"`);
        }
        if (ev.start > cursor) gaps.push({ start: cursor, end: ev.start });
        cursor = Math.max(cursor, ev.end);
      });
      if (cursor < bed) gaps.push({ start: cursor, end: bed });
      dayGaps[d.offset] = gaps;
      dayConflicts[d.offset] = conflicts;
    });

    let units = tasks.flatMap(expandTask);
    // Deadline first (never let priority bump something due sooner) — within the same due
    // day, higher priority claims slots first; then earlier target day; longer units as a tiebreak.
    units.sort((a, b) =>
      a.dueOffset - b.dueOffset
      || (PRIORITY_RANK[b.priority] ?? 1) - (PRIORITY_RANK[a.priority] ?? 1)
      || (a.targetOffset ?? 0) - (b.targetOffset ?? 0)
      || b.unitDuration - a.unitDuration
    );

    // Try to fit `duration` inside a gap, restricted to [windowStart, windowEnd).
    // Best-fit: picks the smallest gap that still works, so large open blocks of time
    // stay intact for whatever needs them later instead of getting chipped away first-come.
    function tryPlace(gaps, duration, windowStart, windowEnd) {
      let bestIdx = -1, bestSize = Infinity, bestStart = null;
      for (let i = 0; i < gaps.length; i++) {
        const g = gaps[i];
        const s = Math.max(g.start, windowStart);
        const e = Math.min(g.end, windowEnd);
        const avail = e - s;
        if (avail >= duration && avail < bestSize) {
          bestSize = avail; bestIdx = i; bestStart = s;
        }
      }
      if (bestIdx === -1) return null;
      const g = gaps[bestIdx];
      const placeStart = bestStart, placeEnd = bestStart + duration;
      const remainder = [];
      if (g.start < placeStart) remainder.push({ start: g.start, end: placeStart });
      if (placeEnd < g.end) remainder.push({ start: placeEnd, end: g.end });
      gaps.splice(bestIdx, 1, ...remainder);
      return placeStart;
    }

    const placedByDay = {};
    WEEK_DAYS.forEach(d => placedByDay[d.offset] = []);
    let unplacedTasks = [];

    units.forEach(unit => {
      const band = PREF_BAND[unit.pref];
      const order = offsetOrder(unit);
      let result = null;

      if (band) {
        for (const offset of order) {
          const gaps = dayGaps[offset];
          if (!gaps) continue;
          const start = tryPlace(gaps, unit.unitDuration, band.start, band.end);
          if (start !== null) { result = { offset, start, matchedPref: true }; break; }
        }
      }
      if (!result) {
        for (const offset of order) {
          const gaps = dayGaps[offset];
          if (!gaps) continue;
          const start = tryPlace(gaps, unit.unitDuration, 0, 24 * 60);
          if (start !== null) { result = { offset, start, matchedPref: false }; break; }
        }
      }

      if (result) {
        placedByDay[result.offset].push({ ...unit, name: unit.unitName, start: result.start, end: result.start + unit.unitDuration, matchedPref: result.matchedPref });
      } else {
        unplacedTasks.push(unit.unitName);
      }
    });

    // Weekly summary stats
    let totalFree = 0;
    let busiestDay = null;
    let overloadedCount = 0;
    const overloadedDayOffsets = new Set();
    WEEK_DAYS.forEach(d => {
      const busy = events.filter(e => e.offset === d.offset).reduce((sum, e) => sum + (e.end - e.start), 0)
        + placedByDay[d.offset].reduce((sum, t) => sum + (t.end - t.start), 0);
      const free = Math.max(0, dayWindow - busy);
      totalFree += free;
      if (!busiestDay || free < busiestDay.free) busiestDay = { label: d.label, free };
      if (free < 60) { overloadedCount++; overloadedDayOffsets.add(d.offset); }
    });

    return { wake, bed, dayConflicts, placedByDay, unplacedTasks, totalFree, busiestDay, overloadedCount, overloadedDayOffsets };
  }

  function renderSchedule() {
    const wrap = document.getElementById('timelineWrap');
    const data = lastScheduleData;
    if (!data) return;
    const { wake, bed, dayConflicts, placedByDay, unplacedTasks, totalFree, busiestDay, overloadedCount, overloadedDayOffsets } = data;

    let html = `<div class="summary-card">
      <div class="s-title">This week at a glance</div>
      <ul>
        <li>${(totalFree / 60).toFixed(1)}h free across the week</li>
        <li${overloadedCount > 0 ? ' class="warn"' : ''}>Busiest day: ${busiestDay.label} (only ${(busiestDay.free / 60).toFixed(1)}h free)</li>
        ${overloadedCount > 0 ? `<li class="warn">${overloadedCount} day${overloadedCount > 1 ? 's' : ''} packed tight (under 1h free)</li>` : ''}
        ${unplacedTasks.length > 0 ? `<li class="warn">${unplacedTasks.length} session${unplacedTasks.length > 1 ? 's' : ''} couldn't fit before their due day</li>` : ''}
      </ul>
    </div>`;

    let anythingShown = false;
    const now = new Date();
    const nowMins = now.getHours() * 60 + now.getMinutes();
    const todayDateKey = WEEK_DAYS[0].dateKey;

    WEEK_DAYS.forEach(d => {
      const dayEvents = events.filter(e => e.offset === d.offset).map(e => ({ ...e, type: 'fixed' }));
      const dayTasks = placedByDay[d.offset].map(t => ({ ...t, type: 'task' }));
      if (dayEvents.length === 0 && dayTasks.length === 0) return;
      anythingShown = true;

      const blocks = [...dayEvents, ...dayTasks].sort((a, b) => a.start - b.start);
      const isToday = d.offset === 0;
      let markerPlaced = !isToday;

      html += `<div class="day-section">
        <div class="day-heading"><span>${escapeHtml(d.label)}</span><span class="sub">${d.dateStr}</span></div>`;

      if (dayConflicts[d.offset].length > 0) {
        html += `<div class="day-warn">⚠ Conflict: ${dayConflicts[d.offset].join('; ')}.</div>`;
      }
      if (overloadedDayOffsets.has(d.offset)) {
        html += `<div class="day-warn">⚠ Packed day — under an hour free between wake and bed.</div>`;
      }

      blocks.forEach(b => {
        if (isToday && !markerPlaced && b.start > nowMins) {
          html += `<div class="now-line"><div class="bar"></div><div class="lbl">NOW &middot; ${formatMinutes(nowMins)}</div><div class="bar"></div></div>`;
          markerPlaced = true;
        }
        const taskMeta = b.recurring ? 'recurring' : ('due ' + dayLabelFor(b.dueOffset));
        const done = b.type === 'task' && isInstanceComplete(b, isToday ? todayDateKey : (d.dateKey), b.sessionIndex);
        const missed = isToday && b.end <= nowMins && b.type === 'task' && !done;
        html += `<div class="tl-item">
          <div class="tl-time">${formatMinutes(b.start)}</div>
          <div class="tl-line"><div class="tl-dot ${b.type === 'task' ? 'task' : ''}"></div></div>
          <div class="tl-block ${b.type === 'fixed' ? 'fixed' : 'task-block'}${done ? ' done' : ''}${(missed || (isToday && b.type === 'fixed' && b.end <= nowMins)) ? ' past' : ''}">
            <div class="name">${escapeHtml(b.name)}</div>
            <div class="meta">${formatMinutes(b.start)} – ${formatMinutes(b.end)}${b.type === 'task' ? ' &middot; ' + taskMeta + (b.pref !== 'any' && !b.matchedPref ? ` &middot; no ${b.pref} slot open, moved here` : '') : ''}${missed ? ' &middot; <span class="missed-tag">missed</span>' : ''}</div>
          </div>
        </div>`;
      });
      if (isToday && !markerPlaced) {
        html += `<div class="now-line"><div class="bar"></div><div class="lbl">NOW &middot; ${formatMinutes(nowMins)}</div><div class="bar"></div></div>`;
      }

      html += `<div class="tl-item">
        <div class="tl-time">${formatMinutes(bed)}</div>
        <div class="tl-line"><div class="tl-dot sleep"></div></div>
        <div class="tl-block sleep-block">
          <div class="name">Sleep</div>
          <div class="meta">${formatMinutes(bed)} – ${formatMinutes(wake)} next day &middot; protected, nothing gets scheduled here</div>
        </div>
      </div>`;

      html += `</div>`;
    });

    if (!anythingShown) {
      html += '<div class="empty">Nothing scheduled this week.</div>';
    }

    if (unplacedTasks.length > 0) {
      html += `<div class="leftover">Couldn't fit: ${escapeHtml(unplacedTasks.join(', '))}. Try freeing up time or moving the due day.</div>`;
    }

    wrap.innerHTML = html;
  }

  // ==================== MAIN NAV ====================

  function switchMainView(view) {
    mainView = view;
    document.getElementById('navToday').classList.toggle('active', view === 'today');
    document.getElementById('navPlan').classList.toggle('active', view === 'plan');
    document.getElementById('todayView').classList.toggle('hidden', view !== 'today');
    document.getElementById('planView').classList.toggle('hidden', view !== 'plan');
    if (view === 'today') renderTodayDashboard();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function goAddTask() {
    switchMainView('plan');
    switchTab('task');
    setTimeout(() => document.getElementById('tkName').focus(), 250);
  }

  // ==================== COMPLETION ====================
  // Simple tasks: a plain `completed` flag (done forever, drops out of scheduling).
  // Split tasks: `completedSessions` tracks which sessions are done; all-done implies `completed`.
  // Recurring tasks: no single "done" state — each calendar day is tracked separately in
  // `completions`, keyed by date so a check-off doesn't bleed into next week's occurrence.

  function isInstanceComplete(task, dateKey, sessionIndex) {
    if (task.recurring) return !!completions[task.id + ':' + dateKey];
    if (task.split) return (task.completedSessions || []).includes(sessionIndex);
    return !!task.completed;
  }

  function setInstanceComplete(taskId, dateKey, sessionIndex, isComplete) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    if (task.recurring) {
      const key = taskId + ':' + dateKey;
      if (isComplete) completions[key] = true; else delete completions[key];
    } else if (task.split) {
      task.completedSessions = task.completedSessions || [];
      const i = task.completedSessions.indexOf(sessionIndex);
      if (isComplete && i === -1) task.completedSessions.push(sessionIndex);
      if (!isComplete && i !== -1) task.completedSessions.splice(i, 1);
      const numSessions = Math.max(1, Math.ceil(task.duration / task.sessionLen));
      task.completed = task.completedSessions.length >= numSessions;
    } else {
      task.completed = isComplete;
    }
    saveData(); // also refreshes the Today dashboard
    renderList();
    if (lastScheduleData) { lastScheduleData = computeSchedule(); renderSchedule(); }
  }

  // ==================== TODAY DASHBOARD ====================

  function greetingWord() {
    const h = new Date().getHours();
    if (h < 5) return 'Still up?';
    if (h < 12) return 'Good morning';
    if (h < 17) return 'Good afternoon';
    return 'Good evening';
  }

  function computeTodayBlocks() {
    const schedule = computeSchedule();
    const today = WEEK_DAYS[0];
    const dayEvents = events.filter(e => e.offset === 0).map(e => ({ ...e, type: 'fixed' }));
    const dayTasks = schedule.placedByDay[0].map(t => ({ ...t, type: 'task' }));
    const blocks = [...dayEvents, ...dayTasks].sort((a, b) => a.start - b.start);
    return { schedule, today, blocks };
  }

  function computeTodayProgress(blocks, dateKey) {
    const taskBlocks = blocks.filter(b => b.type === 'task');
    const total = taskBlocks.length;
    const done = taskBlocks.filter(b => isInstanceComplete(b, dateKey, b.sessionIndex)).length;
    return { total, done };
  }

  function minutesUntilLabel(mins) {
    mins = Math.max(0, mins);
    if (mins < 60) return `${mins}m`;
    const h = Math.floor(mins / 60), m = mins % 60;
    return m ? `${h}h ${m}m` : `${h}h`;
  }

  function computeNextUp(blocks, dateKey, nowMins) {
    const actionable = b => !(b.type === 'task' && isInstanceComplete(b, dateKey, b.sessionIndex));
    const ongoing = blocks.find(b => b.start <= nowMins && nowMins < b.end && actionable(b));
    if (ongoing) return { block: ongoing, status: 'now' };
    const upcoming = blocks.filter(b => b.start >= nowMins && actionable(b)).sort((a, b) => a.start - b.start)[0];
    if (upcoming) return { block: upcoming, status: 'next' };
    return null;
  }

  function renderNextUpCard(next, dateKey, nowMins) {
    if (!next) {
      return `<div class="next-up-card now">
        <div class="nu-label">ALL CAUGHT UP</div>
        <div class="empty-msg">Nothing left on today's plan. Nice work!</div>
      </div>`;
    }
    const { block, status } = next;
    const untilText = status === 'now'
      ? `Now &middot; until ${formatMinutes(block.end)}`
      : `${formatMinutes(block.start)} &middot; in ${minutesUntilLabel(block.start - nowMins)}`;
    const startBtn = block.type === 'task'
      ? `<button class="start-btn" onclick="startFocus(${block.id}, '${dateKey}', ${block.sessionIndex ?? 'null'}, ${block.end - block.start})">&#9654; Start</button>`
      : '';
    return `<div class="next-up-card ${status === 'now' ? 'now' : ''}">
      <div class="nu-label">${status === 'now' ? 'HAPPENING NOW' : 'NEXT UP'}</div>
      <div class="nu-name">${escapeHtml(block.name)}</div>
      <div class="nu-meta">${untilText}</div>
      ${startBtn}
    </div>`;
  }

  function renderDashboardBlock(b, dateKey, i, nowMins) {
    const isPastEnd = b.end <= nowMins;
    if (b.type === 'fixed') {
      return `<div class="tl-item" style="animation-delay:${i * 30}ms">
        <div class="tl-time">${formatMinutes(b.start)}</div>
        <div class="tl-line"><div class="tl-dot"></div></div>
        <div class="tl-block fixed${isPastEnd ? ' past' : ''}">
          <div class="name">${escapeHtml(b.name)}</div>
          <div class="meta">${formatMinutes(b.start)} – ${formatMinutes(b.end)}</div>
        </div>
      </div>`;
    }
    const done = isInstanceComplete(b, dateKey, b.sessionIndex);
    const missed = isPastEnd && !done;
    const priorityTag = b.priority && b.priority !== 'normal' ? ` <span class="priority-tag ${b.priority}">${PRIORITY_LABEL[b.priority]}</span>` : '';
    const categoryTag = b.category ? ` <span class="category-tag">${escapeHtml(b.category)}</span>` : '';
    const missedPref = b.pref !== 'any' && !b.matchedPref ? ` &middot; no ${b.pref} slot open, moved here` : '';
    const remainingLabel = b.split ? ` &middot; ${taskTimeRemaining(tasks.find(t => t.id === b.id) || b)}m left of ${b.duration}m` : '';
    return `<div class="tl-item" style="animation-delay:${i * 30}ms">
      <div class="tl-time">${formatMinutes(b.start)}</div>
      <div class="tl-line"><div class="tl-dot task"></div></div>
      <div class="tl-block task-block${done ? ' done' : ''}${missed ? ' past' : ''}${b.priority === 'high' && !done ? ' priority-high' : ''}">
        <div style="display:flex; align-items:flex-start; gap:10px;">
          <div class="check-circle${done ? ' checked' : ''}" onclick="setInstanceComplete(${b.id}, '${dateKey}', ${b.sessionIndex ?? 'null'}, ${!done})"></div>
          <div style="flex:1; min-width:0;">
            <div class="tc-top"><div class="name">${escapeHtml(b.name)}</div>${priorityTag}${categoryTag}</div>
            <div class="meta">${formatMinutes(b.start)} – ${formatMinutes(b.end)}${missedPref}${remainingLabel}${missed ? ' &middot; <span class="missed-tag">missed</span>' : ''}</div>
            ${b.notes ? `<div class="notes-preview">${escapeHtml(b.notes)}</div>` : ''}
            ${renderSubtaskChecklist(b, true)}
            ${!done ? `<div class="tc-actions"><button class="start-btn small" onclick="startFocus(${b.id}, '${dateKey}', ${b.sessionIndex ?? 'null'}, ${b.end - b.start})">&#9654; Start</button></div>` : ''}
          </div>
        </div>
      </div>
    </div>`;
  }

  // ---- "What should I do right now?" — recommends the most urgent task that fits
  // the free time between now and the next fixed event (or bedtime), falling back to
  // the single most urgent task if nothing actually fits that window.
  let whatNowPool = [];
  let whatNowIndex = 0;

  function computeWhatToDoNow() {
    const now = new Date();
    const nowMins = now.getHours() * 60 + now.getMinutes();
    const bed = toMinutes(document.getElementById('bedTime').value);
    const dayEvents = events.filter(e => e.offset === 0).sort((a, b) => a.start - b.start);
    const nextEvent = dayEvents.find(e => e.start > nowMins);
    let availableMinutes, untilLabel;
    if (nextEvent) {
      availableMinutes = nextEvent.start - nowMins;
      untilLabel = `before "${nextEvent.name}"`;
    } else if (nowMins < bed) {
      availableMinutes = bed - nowMins;
      untilLabel = 'before bed';
    } else {
      availableMinutes = 120;
      untilLabel = '';
    }

    const todayKey = WEEK_DAYS[0].dateKey;
    const allUnits = tasks.flatMap(expandTask);
    // Only today's occurrence of a recurring task is relevant to "right now".
    const relevant = allUnits.filter(u => u.recurring ? u.forceOffset === 0 : true);
    const incomplete = relevant.filter(u => !isInstanceComplete(u, todayKey, u.sessionIndex));
    const fitting = incomplete.filter(u => u.unitDuration <= availableMinutes);
    const pool = (fitting.length > 0 ? fitting : incomplete).slice().sort((a, b) =>
      (a.dueOffset ?? 99) - (b.dueOffset ?? 99)
      || (PRIORITY_RANK[b.priority] ?? 1) - (PRIORITY_RANK[a.priority] ?? 1)
      || a.unitDuration - b.unitDuration
    );
    return { pool, availableMinutes, untilLabel, fits: fitting.length > 0, todayKey };
  }

  function showWhatNow() {
    const { pool, availableMinutes, untilLabel, fits, todayKey } = computeWhatToDoNow();
    whatNowPool = pool;
    whatNowIndex = 0;
    renderWhatNowResult(availableMinutes, untilLabel, fits, todayKey);
  }

  function nextWhatNowSuggestion() {
    if (whatNowPool.length === 0) return;
    whatNowIndex = (whatNowIndex + 1) % whatNowPool.length;
    const { availableMinutes, untilLabel, fits, todayKey } = computeWhatToDoNow();
    renderWhatNowResult(availableMinutes, untilLabel, fits, todayKey);
  }

  function renderWhatNowResult(availableMinutes, untilLabel, fits, todayKey) {
    const wrap = document.getElementById('whatNowResult');
    if (!wrap) return;
    if (whatNowPool.length === 0) {
      wrap.innerHTML = `<div class="empty">Nothing left on your list right now — nice work!</div>`;
      return;
    }
    const chosen = whatNowPool[whatNowIndex];
    const fitNote = fits
      ? `You have ${minutesUntilLabel(availableMinutes)} available${untilLabel ? ' ' + untilLabel : ''}.`
      : `Nothing fits your ${minutesUntilLabel(availableMinutes)} window${untilLabel ? ' ' + untilLabel : ''} exactly, but this is the most urgent thing on your list.`;
    const again = whatNowPool.length > 1
      ? `<button class="focus-cancel" style="margin-top:10px;" onclick="nextWhatNowSuggestion()">Try another suggestion</button>` : '';
    wrap.innerHTML = `<div class="next-up-card now">
      <div class="nu-label">SUGGESTED</div>
      <div class="nu-name">${escapeHtml(chosen.unitName)}</div>
      <div class="nu-meta">${fitNote}</div>
      <button class="start-btn" onclick="startFocus(${chosen.id}, '${todayKey}', ${chosen.sessionIndex ?? 'null'}, ${chosen.unitDuration})">&#9654; Start Task</button>
      ${again}
    </div>`;
  }

  // ---- "I have X minutes" — suggests from TODAY's own remaining plan, not the whole backlog,
  // so it respects whatever the scheduler already decided about priority/preferences/deadlines.
  let selectedMinutesFilter = null;

  function findMinutesSuggestions(minutes, chipEl) {
    selectedMinutesFilter = minutes;
    document.querySelectorAll('#minutesChips .chip').forEach(c => c.classList.remove('active'));
    if (chipEl) chipEl.classList.add('active');
    renderMinutesResults();
  }

  function renderMinutesResults() {
    const results = document.getElementById('minutesResults');
    if (!results || selectedMinutesFilter === null) return;
    const { blocks, today } = computeTodayBlocks();
    const dateKey = today.dateKey;
    const matches = blocks
      .filter(b => b.type === 'task' && (b.end - b.start) <= selectedMinutesFilter && !isInstanceComplete(b, dateKey, b.sessionIndex))
      .sort((a, b) => (PRIORITY_RANK[b.priority] ?? 1) - (PRIORITY_RANK[a.priority] ?? 1) || a.start - b.start)
      .slice(0, 3);
    if (matches.length === 0) {
      results.innerHTML = `<div class="empty">Nothing that short left on today's plan.</div>`;
      return;
    }
    results.innerHTML = matches.map(b => `
      <div class="suggestion-row">
        <div class="sg-info">
          <div class="t">${escapeHtml(b.name)}</div>
          <div class="d">${b.end - b.start} min &middot; ${formatMinutes(b.start)}</div>
        </div>
        <button class="start-btn small" onclick="startFocus(${b.id}, '${dateKey}', ${b.sessionIndex ?? 'null'}, ${b.end - b.start})">&#9654; Start</button>
      </div>`).join('');
  }

  function renderTodayDashboard() {
    const container = document.getElementById('todayView');
    if (!container) return;
    selectedMinutesFilter = null;

    const now = new Date();
    const nowMins = now.getHours() * 60 + now.getMinutes();
    const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    const greeting = `<div class="dash-greeting"><div class="h1">${greetingWord()}</div><div class="sub">${dateStr} &middot; <span class="live-clock" id="liveClockSpan">${formatMinutes(nowMins)}</span></div></div>`;

    if (events.length === 0 && tasks.length === 0) {
      container.innerHTML = greeting + `<div class="dash-empty">
        <div class="big">&#128197;</div>
        Nothing on the board yet.<br>Add a class, practice, or task to get started.
        <div><button class="add-cta" onclick="goAddTask()">+ Add a task</button></div>
      </div>`;
      return;
    }

    const { schedule, today, blocks } = computeTodayBlocks();
    const dateKey = today.dateKey;
    const { total, done } = computeTodayProgress(blocks, dateKey);
    const pct = total > 0 ? Math.round((done / total) * 100) : 0;
    const next = computeNextUp(blocks, dateKey, nowMins);

    let html = greeting;

    if (total > 0) {
      html += `<div class="progress-card">
        <div class="progress-head"><span>Today's progress</span><span class="progress-frac">${done} / ${total} done</span></div>
        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
      </div>`;
    }

    html += renderNextUpCard(next, dateKey, nowMins);

    html += `<div class="minutes-card">
      <div class="mc-title">What should I do right now?</div>
      <button type="button" class="whatnow-btn" onclick="showWhatNow()">Find something to work on</button>
      <div id="whatNowResult" style="margin-top:10px;"></div>
    </div>`;

    html += `<div class="minutes-card">
      <div class="mc-title">I have a few minutes free</div>
      <div class="chip-row" id="minutesChips">
        ${[10, 15, 20, 30, 45, 60].map(m => `<button type="button" class="chip" onclick="findMinutesSuggestions(${m}, this)">${m < 60 ? m + 'm' : '1h'}</button>`).join('')}
      </div>
      <div class="minutes-results" id="minutesResults"></div>
    </div>`;

    if (schedule.dayConflicts[0] && schedule.dayConflicts[0].length > 0) {
      html += `<div class="day-warn">⚠ Conflict: ${schedule.dayConflicts[0].join('; ')}.</div>`;
    }

    const remainingBlocks = blocks.filter(b => b.type === 'fixed' || !isInstanceComplete(b, dateKey, b.sessionIndex));
    const completedBlocks = blocks.filter(b => b.type === 'task' && isInstanceComplete(b, dateKey, b.sessionIndex));

    html += `<div class="day-plan-title">Today's plan</div>`;
    if (blocks.length === 0) {
      html += `<div class="empty">Nothing scheduled for today — add a task or event, then check Plan &rarr; Build my week.</div>`;
    } else if (remainingBlocks.length === 0) {
      html += `<div class="empty">Nothing left on today's plan. Nice work!</div>`;
    } else {
      let markerPlaced = false;
      const nowMarker = `<div class="now-line"><div class="bar"></div><div class="lbl">NOW &middot; ${formatMinutes(nowMins)}</div><div class="bar"></div></div>`;
      remainingBlocks.forEach((b, i) => {
        if (!markerPlaced && b.start > nowMins) { html += nowMarker; markerPlaced = true; }
        html += renderDashboardBlock(b, dateKey, i, nowMins);
      });
      if (!markerPlaced) html += nowMarker;
    }

    if (schedule.unplacedTasks && schedule.unplacedTasks.length > 0) {
      html += `<div class="leftover">Couldn't fit: ${escapeHtml(schedule.unplacedTasks.join(', '))}. Check Plan for details.</div>`;
    }

    if (completedBlocks.length > 0) {
      html += `<div class="section-subtitle">Completed today (${completedBlocks.length})</div>`;
      completedBlocks.forEach((b, i) => { html += renderDashboardBlock(b, dateKey, i, nowMins); });
    }

    container.innerHTML = html;
  }

  // Keep Today's clock, "now" marker, and next-up state fresh without the user having to
  // touch anything. A full re-render (rather than just patching the clock text) is cheap here
  // and keeps everything — next up, the now-marker position, missed-task flags — in sync.
  setInterval(() => { if (mainView === 'today' && !focusState) renderTodayDashboard(); }, 60000);

  // ==================== FOCUS TIMER ====================
  let focusState = null;
  let focusHideTimer = null;

  function stopFocusInterval() {
    if (focusState && focusState.intervalId) clearInterval(focusState.intervalId);
  }

  function startFocus(taskId, dateKey, sessionIndex, durationMinutes) {
    const task = tasks.find(t => t.id === taskId);
    if (!task) return;
    stopFocusInterval();
    if (focusHideTimer) { clearTimeout(focusHideTimer); focusHideTimer = null; }
    const label = task.split
      ? `${task.name} (session ${sessionIndex + 1}/${Math.max(1, Math.ceil(task.duration / task.sessionLen))})`
      : task.name;
    focusState = {
      taskId, dateKey, sessionIndex, name: label,
      remainingSeconds: durationMinutes * 60,
      paused: false, finished: false, intervalId: null
    };
    renderFocusOverlay();
    const el = document.getElementById('focusOverlay');
    el.classList.remove('hidden');
    void el.offsetHeight;
    el.classList.add('open');
    focusState.intervalId = setInterval(focusTick, 1000);
  }

  function focusTick() {
    if (!focusState || focusState.paused || focusState.finished) return;
    focusState.remainingSeconds--;
    if (focusState.remainingSeconds <= 0) {
      focusState.remainingSeconds = 0;
      focusState.finished = true;
      stopFocusInterval();
    }
    renderFocusOverlay();
  }

  function toggleFocusPause() {
    if (!focusState || focusState.finished) return;
    focusState.paused = !focusState.paused;
    renderFocusOverlay();
  }

  function renderFocusOverlay() {
    if (!focusState) return;
    document.getElementById('focusLabel').textContent = focusState.finished ? "TIME'S UP" : (focusState.paused ? 'PAUSED' : 'FOCUS');
    document.getElementById('focusName').textContent = focusState.name;
    const m = Math.floor(focusState.remainingSeconds / 60);
    const s = focusState.remainingSeconds % 60;
    const timeEl = document.getElementById('focusTime');
    timeEl.textContent = `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    timeEl.classList.toggle('done-flash', focusState.finished);
    const pauseBtn = document.getElementById('focusPauseBtn');
    pauseBtn.textContent = focusState.paused ? 'Resume' : 'Pause';
    pauseBtn.classList.toggle('hidden', focusState.finished);
  }

  function finishFocus(markDone) {
    if (!focusState) { closeFocusOverlay(); return; }
    stopFocusInterval();
    if (markDone) setInstanceComplete(focusState.taskId, focusState.dateKey, focusState.sessionIndex, true);
    closeFocusOverlay();
  }

  function closeFocusOverlay() {
    const el = document.getElementById('focusOverlay');
    el.classList.remove('open');
    focusHideTimer = setTimeout(() => { el.classList.add('hidden'); focusHideTimer = null; }, 200);
    stopFocusInterval();
    focusState = null;
  }

  // These three run last, after every const/function above is defined — loadData()
  // synchronously calls renderList(), which reads PREF_LABEL/DOW_ABBR etc., so running
  // this any earlier throws a "Cannot access before initialization" TDZ error for any
  // returning user who has saved tasks.
  document.getElementById('todayLabel').textContent = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
  populateDaySelects();
  loadData();
</script>
</body>
</html>
